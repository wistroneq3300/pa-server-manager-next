<script>
(()=>{const root=document.getElementById('vera-endpoints');let tray=7,node=3,role=0;const roles=['Host OS','Host BMC','DPU OS','DPU BMC'];const n2=n=>String(n).padStart(2,'0');
const ip=(t,n,r)=>{const index=(t-1)*16+(n-1)*4+r;const blocks=['192.0.2.','198.51.100.','203.0.113.'];return blocks[Math.floor(index/254)]+(index%254+1)};
const state=(t,n,r)=>t===7&&r===0?(n===3?'bad':'good'):'unknown';const status=s=>s==='bad'?'Ping \u4e0d\u53ef\u9054':s==='good'?'Ping \u53ef\u9054':'\u672a\u6aa2\u67e5';
function detail(){const s=state(tray,node,role);root.querySelector('.v-detail-path').textContent=`Rack A / Tray ${n2(tray)} / C2-${n2(node)} / ${role>1?'BF4 / ':''}${roles[role]}`;const fields=[['IP',ip(tray,node,role)],['MAC','\u672a\u53d6\u5f97'],['Ping \u72c0\u614b',status(s)],['SSH \u670d\u52d9','\u5c1a\u672a\u9a57\u8b49']];root.querySelector('.v-fields').replaceChildren(...fields.map(([k,v])=>{const d=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;d.append(dt,dd);return d}));root.querySelector('.v-action-note').hidden=true;root.querySelectorAll('.v-endpoint').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.node===node&&+b.dataset.role===role)));}
function draw(){root.querySelector('.v-trays').replaceChildren(...Array.from({length:32},(_,i)=>{const b=document.createElement('button');b.type='button';b.textContent='T'+n2(i+1);b.setAttribute('aria-label',`Tray ${n2(i+1)}${i===6?'\uff0cHost OS \u6709\u4e0d\u53ef\u9054\u793a\u610f':''}`);b.setAttribute('aria-pressed',String(i+1===tray));b.dataset.problem=String(i===6);b.onclick=()=>{tray=i+1;draw()};return b}));root.querySelector('#v-tray-name').textContent='Tray '+n2(tray);root.querySelector('.v-boards').replaceChildren(...Array.from({length:4},(_,i)=>{const section=document.createElement('section');section.className='v-board';section.innerHTML=`<div class="v-board-head"><h3>C2-${n2(i+1)}</h3><span>4 IP</span></div>`;['Host','BF4'].forEach((group,g)=>{const wrap=document.createElement('div');wrap.innerHTML=`<div class="v-group">${group}</div>`;for(let r=g*2;r<g*2+2;r++){const s=state(tray,i+1,r),b=document.createElement('button');b.type='button';b.className='v-endpoint';b.dataset.node=i+1;b.dataset.role=r;b.innerHTML=`<span class="v-role"><i class="v-dot ${s}"></i>${roles[r]}</span><strong>${ip(tray,i+1,r)}</strong><span class="v-result">${status(s)}</span>`;b.onclick=()=>{node=i+1;role=r;detail()};wrap.append(b)}section.append(wrap)});return section}));detail();}
root.querySelector('#v-terminal').onclick=()=>{const p=root.querySelector('.v-action-note');p.hidden=false;p.textContent=`\u76ee\u6a19\uff1aT${n2(tray)} / C2-${n2(node)} / ${roles[role]}\u3002\u6b63\u5f0f\u9023\u7dda\u524d\u4f7f\u7528\u6b64\u7aef\u9ede\u7684 SSH \u8a2d\u5b9a\u3002`};draw();
if(globalThis.Tweak){const config={compact:false};const tweak=new Tweak({container:root,onChange:()=>root.querySelectorAll('.v-endpoint').forEach(e=>e.style.minHeight=config.compact?'60px':'76px')});tweak.addToggle(config,'compact',{label:'\u7dca\u6e4a\u7aef\u9ede\u5361\u7247'});}
})();
</script>
